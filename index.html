<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1240">

<meta property="og:description" content="Una playa, una fogata y algunos secretos. Solo para ti.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#070c2c; --noche-2:#0d1650; --azul-rey:#2346c8; --azul-claro:#5b7cf0;
  --morado:#6b2fb3; --morado-2:#8e4fd6; --lila:#c3a6f5; --oro:#f2c14e; --crema:#fbf4e4;
  --texto:#eef0ff; --texto-suave:#c4c9ee; --rojo:#e0383e;
  --vidrio:rgba(13,20,72,.86); --borde:rgba(195,166,245,.35);
  --radio:22px; --sombra:0 20px 60px rgba(0,0,0,.45);
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-rebote:cubic-bezier(.34,1.56,.64,1);
  --fuente-titulo:"Fraunces",Georgia,serif; --fuente:"Nunito",system-ui,sans-serif; --fuente-mano:"Caveat",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--noche);color:var(--texto);font-family:var(--fuente);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px;border-radius:12px}

/* ---------- ESCENA ---------- */
#escena{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#050a26 0%,#0b1550 28%,#1c2f9a 46%,#4b2a9c 54%,#7d3fb8 58%,#2a1f6e 58.2%)}
#escena[inert] .obj{pointer-events:none}
.capa{position:absolute;inset:0;pointer-events:none}
#estrellas span{position:absolute;border-radius:50%;background:#fff;animation:titila var(--d) ease-in-out infinite;animation-delay:var(--r)}
@keyframes titila{0%,100%{opacity:.25}50%{opacity:1}}
.fugaz{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;transform:rotate(-24deg);opacity:0;pointer-events:none}
.fugaz.va{animation:fugaz 1.1s var(--ease-out) forwards}
@keyframes fugaz{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-260px 120px}}

.obj{position:absolute;display:grid;place-items:center;min-width:44px;min-height:44px;transition:transform .16s var(--ease-out)}
.obj:active{transform:scale(.95)}
.obj svg{width:100%;height:auto;display:block;overflow:visible}
.obj.pulsa{animation:pulsa 1s ease-in-out 3}
@keyframes pulsa{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px var(--oro)) brightness(1.4)}}

#o-estrella{top:15%;left:16%;width:clamp(44px,8vmin,56px)}
#o-estrella svg{animation:destello 3.2s ease-in-out infinite}
@keyframes destello{0%,100%{transform:scale(.85) rotate(0deg);opacity:.85}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
.constelacion{position:absolute;top:6%;left:4%;width:clamp(150px,36vmin,260px);pointer-events:none}
.constelacion path{stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1.4s var(--ease-out)}
.constelacion circle{opacity:0;transition:opacity .4s}
.constelacion.ve path{stroke-dashoffset:0}
.constelacion.ve circle{opacity:1}

#o-luna{top:8%;right:9%;width:clamp(70px,18vmin,130px)}
.luna-halo{position:absolute;top:2%;right:2%;width:clamp(170px,40vmin,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(195,166,245,.35),rgba(195,166,245,0) 65%);pointer-events:none}
#cohete{position:absolute;left:-15%;top:40%;width:44px;opacity:0;pointer-events:none}
#cohete.vuela{animation:vuela 1.3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes vuela{0%{opacity:1;translate:0 0;rotate:60deg}100%{opacity:0;translate:min(82vw,1100px) -32vh;rotate:50deg;scale:.4}}

#o-farol{top:27%;left:56%;width:clamp(40px,9vmin,64px);animation:flota 7s ease-in-out infinite}
@keyframes flota{0%,100%{translate:0 0;rotate:-4deg}50%{translate:-18px -14px;rotate:5deg}}
#o-farol .luz-farol{animation:latido 2.4s ease-in-out infinite}
@keyframes latido{50%{opacity:.55}}
#o-farol.sube{animation:sube 1s var(--ease-out) forwards}
@keyframes sube{to{translate:0 -40px;scale:1.25;filter:drop-shadow(0 0 24px #ff6a4a)}}

/* faro (Morse) */
#o-faro{right:20%;bottom:41.6%;width:clamp(30px,6vmin,44px)}
#luz-faro{transition:opacity .08s}
#luz-faro.off{opacity:.12}
.haz{position:absolute;right:calc(20% + clamp(15px,3vmin,22px));bottom:calc(41.6% + clamp(44px,9.6vmin,66px));width:0;height:0;pointer-events:none}
.haz::before{content:"";position:absolute;left:-90px;top:-10px;width:180px;height:20px;background:radial-gradient(ellipse at center,rgba(255,236,170,.55),rgba(255,236,170,0) 70%);transition:opacity .08s}
.haz.off::before{opacity:0}

/* mar */
.mar{position:absolute;left:0;right:0;top:58%;bottom:0;background:linear-gradient(180deg,#1a2878 0%,#15206a 40%,#0f1752 100%)}
.reflejo{position:absolute;top:0;right:calc(9% + clamp(20px,5vmin,40px));width:clamp(30px,8vmin,60px);height:38%;background:linear-gradient(180deg,rgba(220,210,255,.5),rgba(220,210,255,0));filter:blur(6px);animation:brilla 3s ease-in-out infinite}
@keyframes brilla{50%{opacity:.5;transform:scaleX(1.4)}}
.ola{position:absolute;left:0;width:200%;height:40px;animation:ola var(--v) linear infinite}
.ola svg{width:100%;height:100%;display:block}
@keyframes ola{to{transform:translateX(-50%)}}

#o-botella{left:38%;bottom:30%;width:clamp(36px,8vmin,54px);display:none}
#o-botella.llega{display:grid;animation:llega 3s var(--ease-out) both, meceo 2.6s ease-in-out 3s infinite}
@keyframes llega{from{translate:-30vw -8vh;opacity:0;rotate:-40deg}to{translate:0 0;opacity:1;rotate:-18deg}}
@keyframes meceo{0%,100%{rotate:-18deg;translate:0 0}50%{rotate:-8deg;translate:0 -6px}}

/* arena */
.arena{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none}
.arena svg{width:100%;height:100%;display:block}

.palmera{position:absolute;left:-5%;bottom:13%;height:min(50vh,74vmin);aspect-ratio:1/2;pointer-events:none}
.palmera > svg{height:100%;width:100%}
.palmera .hojas{transform-origin:118px 92px;animation:viento 6s ease-in-out infinite}
@keyframes viento{50%{transform:rotate(3deg)}}
#o-coco{position:absolute;left:52%;top:20%;width:24%;pointer-events:auto}
#o-coco.cae{animation:cae .9s cubic-bezier(.5,0,.75,0) forwards}
@keyframes cae{to{translate:10% 330%;rotate:200deg}}
#o-coco.caido{translate:10% 330%;rotate:200deg}

#o-tienda{right:4%;bottom:9%;width:clamp(120px,32vmin,240px)}
#o-flor{left:30%;bottom:18%;width:clamp(40px,9vmin,62px)}
#o-flor svg{transform-origin:50% 100%;animation:viento 4s ease-in-out infinite}
#o-flor.crece svg{animation:crece .8s var(--ease-rebote)}
@keyframes crece{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
#o-bola{left:63%;bottom:24%;width:clamp(30px,6.5vmin,42px);animation:rueda 5s ease-in-out infinite}
@keyframes rueda{0%,100%{translate:0 0;rotate:0deg}50%{translate:14px 2px;rotate:90deg}}
#o-bola.gira{animation:gira .9s var(--ease-out)}
@keyframes gira{to{rotate:720deg;translate:0 -30px}}

#o-fogata{left:50%;bottom:4%;width:clamp(84px,21vmin,150px);translate:-50% 0}
.llama{transform-origin:50% 100%;animation:fuego var(--f) ease-in-out infinite alternate}
@keyframes fuego{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.92,1.08) skewX(3deg)}100%{transform:scale(1.04,.94) skewX(-3deg)}}
.fogata-luz{position:absolute;left:50%;bottom:0;width:clamp(260px,60vmin,520px);aspect-ratio:1.6;translate:-50% 30%;background:radial-gradient(ellipse at center,rgba(255,150,70,.32),rgba(255,150,70,0) 62%);pointer-events:none;animation:latido 2s ease-in-out infinite}
.chispa{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffcf6e;pointer-events:none;animation:chispa var(--t) ease-out forwards}
@keyframes chispa{from{opacity:1;translate:0 0}to{opacity:0;translate:var(--x) var(--y)}}
#o-fogata.aviva .llama{animation-duration:.18s}

#o-cangrejo{bottom:2.5%;left:10%;width:clamp(44px,10vmin,64px);animation:camina 16s ease-in-out infinite}
@keyframes camina{0%,100%{left:8%}45%,55%{left:34%}}
#o-cangrejo svg{animation:patitas .5s steps(2) infinite}
@keyframes patitas{50%{transform:translateY(-2px) rotate(2deg)}}
#burbuja{position:absolute;z-index:5;max-width:220px;padding:10px 14px;border-radius:16px;background:var(--crema);color:#2a1a55;font-weight:800;font-size:15px;box-shadow:var(--sombra);opacity:0;scale:.9;transition:opacity .2s,scale .2s var(--ease-out);pointer-events:none}
#burbuja.ve{opacity:1;scale:1}

#o-bocina{left:60%;bottom:1%;width:clamp(44px,10vmin,62px)}
#o-bocina svg{transform-origin:50% 100%}
.luces{position:absolute;inset:-60%;pointer-events:none;opacity:0;transition:opacity .6s;mix-blend-mode:screen;
  background:conic-gradient(from 0deg at 50% 50%,rgba(255,0,170,0),rgba(255,0,170,.28),rgba(0,210,255,0) 25%,rgba(0,210,255,.28) 40%,rgba(255,220,0,0) 55%,rgba(255,220,0,.25) 70%,rgba(255,0,170,0) 85%)}
#escena.fiesta .luces{opacity:1;animation:gira-copo 5s linear infinite}
#escena.fiesta #o-bocina svg{animation:bum .625s ease-out infinite}
@keyframes bum{0%{transform:scale(1.12)}100%{transform:scale(1)}}
#escena.fiesta #o-cangrejo{animation-play-state:paused}
#escena.fiesta #o-cangrejo svg{animation:baila .3125s ease-in-out infinite alternate}
@keyframes baila{from{transform:rotate(-12deg) translateY(-5px)}to{transform:rotate(12deg) translateY(0)}}
#o-copo{left:47%;top:-8%;width:44px;display:none}
#o-copo.cae{display:grid;animation:copo 14s linear forwards}
#o-copo svg{animation:gira-copo 6s linear infinite}
@keyframes copo{0%{top:-8%;translate:0 0}25%{translate:30px 0}50%{translate:-24px 0}75%{translate:20px 0}100%{top:80%;translate:0 0;opacity:.2}}
@keyframes gira-copo{to{rotate:360deg}}

/* ---------- HUD ---------- */
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;translate:-50% 0;display:flex;gap:10px;z-index:10;opacity:0;pointer-events:none;transition:opacity .5s}
.hud.ve{opacity:1;pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:rgba(10,16,60,.7);border:1px solid var(--borde);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:800;font-size:15px;transition:transform .16s var(--ease-out),background .2s}
.pill:active{transform:scale(.96)}
.pill:hover{background:rgba(35,70,200,.55)}
#toast{position:fixed;top:calc(max(14px,env(safe-area-inset-top)) + 58px);left:50%;translate:-50% -8px;z-index:11;width:min(92vw,420px);padding:12px 18px;border-radius:16px;background:var(--vidrio);border:1px solid var(--borde);text-align:center;font-weight:700;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .25s,translate .25s var(--ease-out)}
#toast.ve{opacity:1;translate:-50% 0}

/* ---------- CANDADO ---------- */
#candado{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,9,35,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:opacity .8s}
#candado.adios{opacity:0;pointer-events:none}
.tarjeta{width:min(100%,420px);padding:30px 26px;border-radius:var(--radio);background:var(--vidrio);border:1px solid var(--borde);box-shadow:var(--sombra);text-align:center}
.tarjeta h1,.tarjeta h2{font-family:var(--fuente-titulo);font-weight:600;line-height:1.15}
.tarjeta h1{font-size:clamp(30px,8vw,40px);margin:10px 0 6px}
.tarjeta .sub{color:var(--texto-suave);line-height:1.5}
.tienda-mini{width:76px;margin:0 auto}
form.clave{margin-top:22px;display:grid;gap:12px}
form.clave label{font-weight:700;line-height:1.4}
.campo{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--borde);background:rgba(255,255,255,.07);color:var(--texto);font:inherit;font-size:18px;text-align:center;letter-spacing:.06em}
.campo:focus{outline:none;border-color:var(--oro)}
.boton{min-height:50px;padding:0 22px;border-radius:14px;background:linear-gradient(135deg,var(--azul-rey),var(--morado));font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(107,47,179,.45);transition:transform .16s var(--ease-out),filter .2s}
.boton:hover{filter:brightness(1.12)}
.boton:active{transform:scale(.97)}
.boton.sec{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--borde)}
.enlace{color:var(--lila);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 8px}
#pista-candado{min-height:1.4em;color:var(--oro);font-weight:700;line-height:1.4}
.tiembla{animation:tiembla .4s}
@keyframes tiembla{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}

/* ---------- DIÁLOGOS ---------- */
dialog{margin:auto;width:min(92vw,440px);max-height:90dvh;padding:0;border:1px solid var(--borde);border-radius:var(--radio);background:var(--vidrio);color:var(--texto);box-shadow:var(--sombra);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(4,7,30,.6)}
dialog[open]{animation:entra .32s var(--ease-out)}
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.96)}}
.dlg{padding:26px 22px 22px;text-align:center;display:grid;gap:12px;justify-items:center}
.dlg h2{font-family:var(--fuente-titulo);font-weight:600;font-size:26px;line-height:1.2}
.dlg p{line-height:1.55;color:var(--texto-suave)}
.dlg p b{color:var(--texto)}
.etiqueta{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.fecha{font-family:var(--fuente-mano);font-size:24px;color:var(--lila)}
.parche{width:96px;height:96px}
.parche-ganado{animation:gana .7s var(--ease-rebote)}
@keyframes gana{from{transform:scale(.4) rotate(-40deg);opacity:0}}
.fotos{display:flex;justify-content:center;gap:10px;margin:6px 0}
.polaroid{background:var(--crema);padding:8px 8px 26px;border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.4);rotate:-2deg}
.polaroid:nth-child(2){rotate:3deg}
.polaroid img{display:block;max-height:36dvh;max-width:100%;width:auto;border-radius:2px}
.fotos.dos .polaroid{flex:1;min-width:0}
.fotos.dos .polaroid img{width:100%;max-height:30dvh;object-fit:cover}
.acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}

.banda{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 4px;width:100%}
.banda > *{width:31%}
.vales{display:grid;gap:10px;width:100%;text-align:left}
.vale{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:2px dashed rgba(242,193,78,.6);background:rgba(242,193,78,.08);line-height:1.4;font-weight:700}
.vale span:first-child{font-size:26px}
.vale small{display:block;font-weight:400;color:var(--texto-suave)}
.banda button,.banda div{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--texto-suave);line-height:1.2}
.banda .parche{width:78px;height:78px}
.vacio .parche{filter:grayscale(1) brightness(.45);opacity:.6}
.separador{width:100%;border-top:1px dashed var(--borde);margin:6px 0 2px}
.morse-codigo{font-size:28px;letter-spacing:.06em;font-weight:900;color:var(--oro);white-space:pre}
.morse-tabla{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:13px;color:var(--texto-suave);font-variant-numeric:tabular-nums;width:100%;text-align:left}
.morse-tabla b{color:var(--texto);display:inline-block;width:1.1em}

/* ---------- CARTA ---------- */
#carta{width:100vw;height:100dvh;max-width:none;max-height:none;border:0;border-radius:0;background:radial-gradient(ellipse at 50% 120%,#3b1f7c 0%,#121a5a 45%,#060a26 100%)}
#carta[open]{display:grid;place-items:center}
.carta-in{width:min(92vw,560px);padding:24px 8px;text-align:center;display:grid;gap:20px;justify-items:center}
.carta-in h2{font-family:var(--fuente-titulo);font-style:italic;font-weight:400;font-size:clamp(28px,7vw,42px);line-height:1.2;color:var(--crema)}
.estrofa{font-family:var(--fuente-titulo);font-style:italic;font-weight:400;font-size:clamp(19px,4.8vw,24px);line-height:1.6;color:var(--crema);display:grid;gap:2px}
.estrofa span{opacity:0;translate:0 8px;animation:verso .7s var(--ease-out) forwards}
@keyframes verso{to{opacity:1;translate:0 0}}
.num-estrofa{font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--lila)}
.felicidades{font-family:var(--fuente-titulo);font-weight:600;font-size:clamp(28px,7vw,40px);line-height:1.2}
.firma{font-family:var(--fuente-mano);font-size:30px;color:var(--lila)}
#respuesta{min-height:1.6em;font-weight:800;color:var(--oro)}
.retamas{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:-1}
.retama{position:absolute;bottom:0;transform-origin:50% 100%;animation:brota 1.2s var(--ease-rebote) both}
@keyframes brota{from{scale:0 .2;opacity:0}}
.lluvia{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.lluvia i{position:absolute;top:-10px;width:3px;height:3px;border-radius:50%;background:var(--oro);animation:llueve var(--t) linear infinite;animation-delay:var(--r)}
@keyframes llueve{to{translate:0 105vh}}

.libro{display:grid;gap:14px;justify-items:center;width:100%}
.titulo-libro{font-family:var(--fuente-mano)!important;font-size:42px!important;color:var(--oro)}
.pagina{width:100%;background:#f6eedc;color:#3a2a55;border-radius:6px 14px 14px 6px;padding:18px 14px 16px;box-shadow:inset 7px 0 0 #dccdaa,0 8px 20px rgba(0,0,0,.35);display:grid;gap:8px;justify-items:center;position:relative;text-align:center;rotate:-.6deg}
.pagina:nth-of-type(even){rotate:.6deg}
.pagina .num{position:absolute;top:6px;right:12px;font-family:var(--fuente-mano);font-size:22px;color:#9a7a4a}
.pagina .fecha{color:#6b2fb3;font-size:22px}
.pagina b{font-family:var(--fuente-titulo);font-size:20px;font-weight:600}
.pagina.vacia p{color:#8a7a6a;font-family:var(--fuente-mano);font-size:23px;line-height:1.3;padding:18px 6px}
.pagina .polaroid img{max-height:26dvh}
.pagina.final{min-height:160px;place-content:center}
#o-tienda .puerta{transition:fill .5s}
#o-tienda.prendida .puerta{fill:#ffc77a}
#o-tienda.prendida svg{filter:drop-shadow(0 0 24px rgba(255,180,90,.8)) brightness(1.12)}
.solo-lector{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .estrofa span{opacity:1;translate:0 0}
}
</style>
</head>
<body>

<main id="escena" inert>
  <div id="estrellas" class="capa" aria-hidden="true"></div>
  <div class="fugaz" aria-hidden="true"></div>

<script>
(() => {
'use strict';
const ITER = 250000;
const PRINCIPALES = ['estrella','farol','flor','bola','luna','fogata'];
const SECRETOS = ['coco','morse','schmubsibu','hielo','sonidera'];
const TODOS = [...PRINCIPALES, ...SECRETOS, 'poema'];
const completo = () => TODOS.every(x => hallados.has(x));
const $ = s => document.querySelector(s);
const escena = $('#escena'), dlg = $('#dlg'), cuerpo = $('#dlg-cuerpo');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
let D = null;

/* ---------- guardado (opcional) ---------- */
let hallados = new Set();
try { hallados = new Set(JSON.parse(localStorage.getItem('c20') || '[]')); } catch (e) {}
const guardar = () => { try { localStorage.setItem('c20', JSON.stringify([...hallados])); } catch (e) {} };

/* ---------- cielo ---------- */
const cielo = $('#estrellas');
for (let i = 0; i < 90; i++) {
  const s = document.createElement('span'), t = Math.random() * 2.2 + .8;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*55}%;width:${t}px;height:${t}px;--d:${(Math.random()*3+2).toFixed(1)}s;--r:-${(Math.random()*4).toFixed(1)}s`;
  cielo.appendChild(s);
}
const fugaz = $('.fugaz');
function estrellaFugaz() {
  fugaz.style.left = (40 + Math.random()*55) + '%'; fugaz.style.top = (4 + Math.random()*22) + '%';
  fugaz.classList.remove('va'); void fugaz.offsetWidth; fugaz.classList.add('va');
}
if (!quieto) setInterval(estrellaFugaz, 7000);

/* pétalos de la flor (rojos y amarillos, como su ramo) */
const pet = $('#petalos');
for (let k = 0; k < 10; k++) pet.insertAdjacentHTML('beforeend', `<ellipse rx="3.6" ry="8" cy="-9" transform="rotate(${k*36})" fill="${k%2?'#f2c14e':'#e0383e'}"/>`);

/* ---------- faro en Morse: TE AMO ---------- */
const MORSE = { T:'-', E:'.', A:'.-', M:'--', O:'---' };
const luz = $('#luz-faro'), haz = $('#haz');
(function faro() {
  const u = 260, pasos = [];
  'TE AMO'.split(' ').forEach((pal, pi) => {
    if (pi) pasos.push([0, 7]);
    [...pal].forEach((l, li) => {
      if (li) pasos.push([0, 3]);
      [...MORSE[l]].forEach((c, ci) => { if (ci) pasos.push([0, 1]); pasos.push([1, c === '.' ? 1 : 3]); });
    });
  });
  pasos.push([0, 12]);
  let i = 0;
  const tic = () => {
    const [on, d] = pasos[i]; luz.classList.toggle('off', !on); haz.classList.toggle('off', !on);
    i = (i + 1) % pasos.length; setTimeout(tic, d * u);
  };
  tic();
})();

/* ---------- parches (insignias bordadas) ---------- */
const ICONOS = {
  estrella:'<path d="M0,-15 L4.4,-4.6 L15,-4.6 L6.4,2.2 L9.4,13 L0,6.6 L-9.4,13 L-6.4,2.2 L-15,-4.6 L-4.4,-4.6Z" fill="#f2c14e"/>',
  farol:'<rect x="-5" y="-17" width="10" height="4" rx="1" fill="#f2c14e"/><ellipse rx="13" ry="12" fill="#e0383e"/><path d="M-6,-11 Q-10,0 -6,11 M0,-12 V12 M6,-11 Q10,0 6,11" stroke="#a51f2a" stroke-width="1.5" fill="none"/><rect x="-5" y="11" width="10" height="4" rx="1" fill="#f2c14e"/>',
  flor:[...Array(10)].map((_,k)=>`<ellipse rx="3" ry="7" cy="-7" transform="rotate(${k*36})" fill="${k%2?'#f2c14e':'#e0383e'}"/>`).join('')+'<circle r="4.5" fill="#f2c14e"/><circle r="2" fill="#7a4a10"/>',
  bola:'<circle r="14" fill="#1f9d55"/><circle r="6.5" fill="#fff"/><text y="3.3" font-size="9" font-weight="900" text-anchor="middle" fill="#111" font-family="Nunito,sans-serif">6</text>',
  luna:'<path d="M0,-17 C7,-10 8,0 6,8 L-6,8 C-8,0 -7,-10 0,-17Z" fill="#eef0ff"/><circle cy="-4" r="3.5" fill="#2346c8" stroke="#f2c14e"/><path d="M-6,2 L-11,10 L-6,8Z M6,2 L11,10 L6,8Z" fill="#e0383e"/><path d="M-3,9 Q0,18 3,9Z" fill="#f2c14e"/>',
  fogata:'<path d="M0,-17 C8,-8 12,0 10,7 C8,14 -8,14 -10,7 C-12,0 -6,-4 -4,-9 C-2,-5 0,-4 1,-2 C3,-8 2,-12 0,-17Z" fill="#ff8a3d"/><path d="M0,-4 C5,1 6,6 4,9 C2,12 -3,12 -4,9 C-6,5 -2,2 0,-4Z" fill="#f2c14e"/>',
  coco:'<circle r="13" fill="#7a4a26"/><circle cx="-4" cy="-3" r="2" fill="#2e180a"/><circle cx="4" cy="-3" r="2" fill="#2e180a"/><path d="M-4 5 Q0 8 4 5" stroke="#2e180a" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  morse:'<g fill="#f2c14e"><circle cx="-13" r="3.2"/><rect x="-7" y="-3.2" width="13" height="6.4" rx="3.2"/><circle cx="12" r="3.2"/></g><path d="M-14 -11 H14 M-14 11 H14" stroke="#c3a6f5" stroke-width="1.4" stroke-dasharray="2 3"/>',
  schmubsibu:'<path d="M-10,0 L-7,13 L7,13 L10,0Z" fill="#c98a4b"/><path d="M-6 2 L-5 12 M0 2 V12 M6 2 L5 12" stroke="#a0662f" stroke-width="1.2"/><path d="M-12,1 C-14,-8 -6,-14 0,-11 C6,-14 14,-8 12,1Z" fill="#f4a6c8"/><circle cy="-13" r="3" fill="#e0383e"/>',

  oro:'<path d="M0,-15 L4.4,-4.6 L15,-4.6 L6.4,2.2 L9.4,13 L0,6.6 L-9.4,13 L-6.4,2.2 L-15,-4.6 L-4.4,-4.6Z" fill="#fff6d6"/><text y="5" font-size="9" font-weight="900" text-anchor="middle" fill="#7a5a10" font-family="Nunito,sans-serif">20</text>',

async function descifrar(clave) {
  const bin = atob(window.CIFRADO), raw = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:raw.slice(0,16), iterations:ITER, hash:'SHA-256' }, base, { name:'AES-CBC', length:256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name:'AES-CBC', iv:raw.slice(16,32) }, llave, raw.slice(32));
  const datos = JSON.parse(new TextDecoder().decode(plano));
  if (datos.ok !== 'campamento20') throw new Error('no');
  return datos;
}

    [1, 1.006, .5].forEach((m, i) => {
      const o = ac.createOscillator(); o.type = i === 2 ? 'square' : 'sawtooth'; o.frequency.value = f * m;
      const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5.2; vg.gain.value = f * m * .006; vib.connect(vg); vg.connect(o.frequency);
      const og = ac.createGain(); og.gain.value = i === 2 ? .25 : .5; o.connect(og); og.connect(caja); o.start(t); vib.start(t); o.stop(t + dura + .1); vib.stop(t + dura + .1);
    });
    caja.connect(brillo); brillo.connect(g); out(g, { eco: true });
  }
  // ambiente: el mar que va y viene + la fogata que truena
  let tFuego;
  function ambiente() {
    if (amb || !ac) return;
    const t = ahora();
    const mar = ac.createBufferSource(); mar.buffer = B.cafe; mar.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 520;
    const g = ac.createGain(); g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(.16, t + 3);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .085; lg.gain.value = .11; lfo.connect(lg); lg.connect(g.gain);
    const lf2 = ac.createGain(); lf2.gain.value = 260; lfo.connect(lf2); lf2.connect(fl.frequency);
    mar.connect(fl); fl.connect(g); g.connect(maestro);
    const espuma = ac.createBufferSource(); espuma.buffer = B.blanco; espuma.loop = true;
    const ef = ac.createBiquadFilter(); ef.type = 'bandpass'; ef.frequency.value = 2600; ef.Q.value = .5;
    const eg = ac.createGain(); eg.gain.value = .007; const lg2 = ac.createGain(); lg2.gain.value = .006; lfo.connect(lg2); lg2.connect(eg.gain);
    espuma.connect(ef); ef.connect(eg); eg.connect(maestro);
    mar.start(t); espuma.start(t); lfo.start(t);
    amb = { parar: () => { try { mar.stop(); espuma.stop(); lfo.stop(); } catch (e) {} amb = null; } };
    const truena = () => { if (amb && on) { const n = 1 + (Math.random() * 3 | 0), t1 = ahora(); for (let i = 0; i < n; i++) toca(B.click, t1 + Math.random() * .12, .025 + Math.random() * .04, { rate: .4 + Math.random() * .6, seco: true }); } tFuego = setTimeout(truena, 350 + Math.random() * 900); };
    truena();
  }
  const efectos = {
    logro: () => { const t = ahora(); [784, 988, 1175, 1568].forEach((f, i) => celesta(f, t + i * .09, .09)); },
    estrella: () => { const t = ahora(); [1319, 1568, 1760, 2093, 2637].forEach((f, i) => celesta(f, t + i * .13, .07)); },
    farol: () => { const t = ahora(); soplo(t, 1.2, 300, 900, .25); [659, 784, 988].forEach((f, i) => cuerda(f, t + .3 + i * .12, .35, { brillo: .6 })); },
    flor: () => { const t = ahora(); [523, 659, 784, 1047, 1319].forEach((f, i) => cuerda(f, t + i * .07, .32, { brillo: .7 })); },
    bola: () => { const t = ahora(); toca(B.bola, t, .5); toca(B.bola, t + .09, .25, { rate: 1.08 }); soplo(t + .1, .8, 200, 140, .12); },
    luna: () => { const t = ahora(); soplo(t, 1.4, 200, 3000, .4, 'bandpass', 1.5, B.blanco); soplo(t, 1.2, 80, 60, .5); },
    fogata: () => { const t = ahora(); soplo(t, 1.6, 250, 800, .6); for (let i = 0; i < 26; i++) toca(B.click, t + Math.random() * 1.4, .1 + Math.random() * .2, { rate: .5 + Math.random() * 1.4 }); },
    coco: () => { const t = ahora(); soplo(t, .5, 2000, 500, .1, 'bandpass', 1, B.blanco); tono(110, t + .7, .7, .4, { desliza: 55 }); toca(B.bombo, t + .7, .4, { rate: 1.6 }); },
    morse: () => { const t = ahora(); [0, .14, .28].forEach((r, i) => tono(i === 1 ? 880 : 740, t + r, .06, .1, { tipo: 'square' })); },
    cangrejo: () => { const t = ahora(); [0, .07, .16].forEach(r => toca(B.click, t + r, .4, { rate: 2.2 })); },
    hielo: () => { const t = ahora(); [3136, 3951, 4699, 5274].forEach((f, i) => tono(f, t + i * .05, .05, 1.2)); soplo(t, .9, 5000, 8000, .1, 'bandpass', 1, B.blanco); },
    tienda: () => { const t = ahora(); toca(B.click, t, .5, { rate: 1.6 }); [262, 330, 392, 523].forEach((f, i) => cuerda(f, t + .2 + i * .05, .3, { brillo: .4 })); },
    botella: () => { const t = ahora(); tono(600, t, .4, .12, { desliza: 300 }); toca(B.click, t, .6, { rate: .6 }); [1047, 1319, 1568, 2093].forEach((f, i) => celesta(f, t + .25 + i * .12, .07)); },
    pagina: () => { const t = ahora(); soplo(t, .35, 2500, 4500, .08, 'bandpass', .8, B.blanco); }
  };
  return {
    iniciar, ambiente, ahora, toca, cuerda, acordeon, tono, crearBus, eco: (t, fb) => { ecoIn.delayTime.setValueAtTime(t, ac.currentTime); vueltaEco.gain.setValueAtTime(fb, ac.currentTime); }, usar: b => { dest = b; }, B: () => B, ok: () => !!ac && on,
    sfx(n) { if (!on || !iniciar()) return; try { efectos[n] && efectos[n](); } catch (e) {} },
    alternar() { on = !on; if (ac) { maestro.gain.setTargetAtTime(on ? .7 : 0, ac.currentTime, .05); if (on) ac.resume(); } return on; },
    get on() { return on; }
  };
})();

let sonando = null;
function cumbia(el) {
  if (sonando) { sonando.parar(); return; }
  const S = D.secretos.sonidera;
  if (!Son.on || !Son.iniciar()) { aviso('🔇 Prende el sonido arriba para escuchar la bocina'); return; }
  const B = Son.B(), beat = 60 / 92, t0 = Son.ahora() + .1, BARS = 14, fuentes = [], bus = Son.crearBus();
  Son.usar(bus); Son.eco(beat * .75, .45);   // el eco largo de sonidero, a tiempo con la música
  const toca = (b, t, v, o) => fuentes.push(Son.toca(b, t, v, o));
  // efecto de sonidero: el "rayo láser" que rebota en el eco
  const laser = (t, n = 3) => { for (let i = 0; i < n; i++) Son.tono(2400 - i * 300, t + i * .19, .05, .32, { tipo: 'triangle', desliza: 240, eco: true }); };
  // progresión clásica de cumbia: La menor y Mi
  const BAJO = [[110, 164.8], [82.4, 123.5]];
  const ACORDES = [[220, 261.6, 329.6], [207.7, 246.9, 329.6]];
  const MEL = [
    [[0, 659.3, .5], [.5, 587.3, .5], [1, 523.3, .5], [1.5, 493.9, .5], [2, 523.3, 1], [3, 440, 1]],
    [[0, 493.9, .5], [.5, 523.3, .5], [1, 587.3, .5], [1.5, 523.3, .5], [2, 493.9, 1], [3, 415.3, 1]],
    [[0, 659.3, .5], [.5, 784, .5], [1, 659.3, .5], [1.5, 587.3, .5], [2, 523.3, .5], [2.5, 587.3, .5], [3, 659.3, 1]],
    [[0, 587.3, .5], [.5, 523.3, .5], [1, 493.9, .5], [1.5, 415.3, .5], [2, 440, 2]]
  ];
  for (let bar = 0; bar < BARS; bar++) {
    const tb = t0 + bar * 4 * beat, am = bar % 2 === 0;
    for (let b = 0; b < 4; b++) {
      const t = tb + b * beat;
      toca(B.guiroL, t, .5, { seco: true }); toca(B.guiroC, t + beat * .5, .35, { seco: true }); toca(B.guiroC, t + beat * .75, .35, { seco: true });
      toca(B.campana, t + beat * .5, .26);
      // guitarra rítmica: el "chiqui-chiqui" del contratiempo
      ACORDES[am ? 0 : 1].forEach((f, k) => Son.cuerda(f, t + beat * .5 + k * .012, .09, { brillo: .45 }));
    }
    // tumbadoras: el tumbao que hace bailar
    toca(B.congaA, tb + 1.5 * beat, .4); toca(B.congaB, tb + 2 * beat, .35); toca(B.congaA, tb + 3.5 * beat, .4); toca(B.congaB, tb + 3.75 * beat, .3);
    if (bar % 4 === 3) [0, .25, .5, .75].forEach((o, i) => toca(i % 2 ? B.congaB : B.congaA, tb + (3 + o) * beat, .3 + i * .05, { rate: 1.25 }));   // redoble antes de cambiar
    toca(B.bombo, tb, .7); toca(B.bombo, tb + 2 * beat, .7);
    const [r, q] = BAJO[am ? 0 : 1];
    Son.cuerda(r, tb, .6, { brillo: .2 }); Son.cuerda(q, tb + 2 * beat, .55, { brillo: .2 }); Son.cuerda(r, tb + 3.5 * beat, .4, { brillo: .2 });
    if (bar % 4 === 0) laser(tb);
    if (bar >= 2 && bar < BARS - 2) MEL[(bar - 2) % 4].forEach(([o, f, d]) => {
      Son.cuerda(f, tb + o * beat, .3, { brillo: .8, eco: true });       // el requinto con eco, como en los bailes
      Son.acordeon(f, tb + o * beat, d * beat * .9, .035);              // y el teclado que lo acompaña
    });
    if (bar >= BARS - 2) MEL[(bar % 2)].forEach(([o, f, d]) => Son.cuerda(f, tb + o * beat, .32, { brillo: .8, eco: true }));
  }
  const fin = t0 + BARS * 4 * beat; toca(B.bombo, fin, .9); Son.cuerda(110, fin, .7, { brillo: .2 }); Son.cuerda(440, fin, .35, { brillo: .8, eco: true }); laser(fin, 4);
  escena.classList.add('fiesta');
  aviso('🔊 ¡Súbele! (si no suena, quita el modo silencio)', 3500);
  const timers = [];
  timers.push(setTimeout(() => burbuja(el, S.burbuja, 6000), 2 * 4 * beat * 1000));
  if (!hallados.has('sonidera')) timers.push(setTimeout(() => ganarSecreto('sonidera'), 6 * 4 * beat * 1000));
  Son.usar(null);
  const parar = lento => {
    timers.forEach(clearTimeout); sonando = null; escena.classList.remove('fiesta');
    bus.apagar(lento);
  };
  timers.push(setTimeout(() => parar(true), (fin - Son.ahora() + 1.5) * 1000));
  sonando = { parar };
}

/* ---------- casa de campaña: luz + libro de aventuras ---------- */
async function tienda(el) {
  el.classList.add('prendida');
  burbuja(el, D.libro.burbuja, 2400);
  await esperar(1500);
  libro();
}
function libro() {
  const L = D.libro;
  const pags = PRINCIPALES.map((p, i) => {
    const R = D.recuerdos[p];
    if (!hallados.has(p)) return `<div class="pagina vacia"><span class="num">${i + 1}</span><p>${L.vacia}</p></div>`;
    return `<button class="pagina" data-ver="${p}"><span class="num">${i + 1}</span>
      <span class="fotos ${R.fotos.length > 1 ? 'dos' : ''}">${R.fotos.map(f => `<span class="polaroid"><img src="${f}" alt="${R.titulo}"></span>`).join('')}</span>
      <span class="fecha">${R.fecha}</span><b>${R.titulo}</b></button>`;
  }).join('');
  abrir(`<div class="libro"><p class="etiqueta">${D.clan}</p><h2 id="dlg-titulo" class="titulo-libro">${L.titulo}</h2><p class="fecha">${L.sub}</p>
    ${pags}
    <div class="pagina vacia final"><p>${L.final}</p></div>
    <div class="acciones"><button class="boton" data-insignias>Ver mis insignias 🎖️</button><button class="boton sec" data-cerrar>Volver a la playa</button></div></div>`);
  dlg.addEventListener('close', () => $('#o-tienda').classList.remove('prendida'), { once: true });
}

/* ---------- gran premio ---------- */
function premio() {
  const P = D.premio;
  abrir(`<div class="parche-ganado">${parche('oro', P.insignia)}</div><p class="etiqueta">Gran premio</p>
    <h2 id="dlg-titulo">${P.titulo}</h2><p>${P.texto}</p>
    <div class="vales">${P.vales.map(([e, t, s]) => `<div class="vale"><span aria-hidden="true">${e}</span><span>${t}${s ? `<small>${s}</small>` : ''}</span></div>`).join('')}</div>
    <p>${P.nota}</p>
    <div class="acciones"><button class="boton" data-cerrar>¡Los quiero todos! 🎁</button></div>`);
}

/* ---------- banda de insignias ---------- */
function banda() {
  const celda = (id, nombre, secreto) => hallados.has(id)
    ? `<button data-ver="${id}">${parche(id, nombre)}<span>${nombre}</span></button>`
    : `<div class="vacio">${parche(id, '? ? ?')}<span>${secreto ? 'Secreta' : 'Por encontrar'}</span></div>`;
  const nS = SECRETOS.filter(s => hallados.has(s)).length;
  const nP = PRINCIPALES.filter(p => hallados.has(p)).length;
  abrir(`<p class="etiqueta">Mis insignias · ${D.clan}</p><h2 id="dlg-titulo">${D.nombre}</h2>
    <p class="etiqueta">Recuerdos · ${nP}/6</p>
    <div class="banda">${PRINCIPALES.map(p => celda(p, D.recuerdos[p].insignia)).join('')}</div>
    <div class="separador"></div><p class="etiqueta">Secretas · ${nS}/5</p>
    <div class="banda">${SECRETOS.map(s => celda(s, D.secretos[s].insignia, true)).join('')}</div>
    <div class="separador"></div>
    ${completo() ? `<button class="boton" data-premio>🎁 Ver mis premios</button>` : `<p>🎁 Junta las 11 insignias y lee el mensaje de la botella para ganar el <b>gran premio</b>.</p>`}
    <div class="acciones"><button class="boton sec" data-cerrar>Volver a la playa</button></div>`);
}
cuerpo.addEventListener('click', e => {
  if (e.target.closest('[data-insignias]')) return banda();
  if (e.target.closest('[data-premio]')) return premio();
  const v = e.target.closest('[data-ver]'); if (!v) return;
  const id = v.dataset.ver;
  if (PRINCIPALES.includes(id)) recuerdo(id, $('#o-' + id));
  else if (id === 'morse') ganarSecreto('morse', D.secretos.morse.exito);
  else ganarSecreto(id);
});

/* ---------- pista ---------- */
const OBJ_SECRETO = { coco:'#o-coco', morse:'#o-faro', schmubsibu:'#o-cangrejo', hielo:null, sonidera:'#o-bocina' };
const brillar = sel => { const el = sel && $(sel); if (!el) return; el.classList.add('pulsa'); setTimeout(() => el.classList.remove('pulsa'), 3200); };
$('#btn-pista').addEventListener('click', () => {
  const p = PRINCIPALES.find(x => !hallados.has(x));
  if (p) { aviso(D.recuerdos[p].pista); return brillar('#o-' + p); }
  if (!hallados.has('poema')) { aviso('Ya tienes las 6. Mira el mar… 🍾'); return brillar('#o-botella'); }
  const s = SECRETOS.find(x => !hallados.has(x));
  if (s) { aviso('🤫 ' + D.pistasSecretas[s]); if (s === 'hielo') soltarCopo(); return; }
  aviso('¡Ya lo completaste todo, exploradora! 🎁 Toca tus insignias para ver tus premios');
});
$('#btn-banda').addEventListener('click', banda);
$('#btn-son').addEventListener('click', e => { const on = Son.alternar(); if (on) { Son.iniciar(); Son.ambiente(); } e.currentTarget.textContent = on ? '🔊' : '🔇'; e.currentTarget.setAttribute('aria-label', on ? 'Apagar el sonido' : 'Prender el sonido'); });

/* ---------- carta final ---------- */
const carta = $('#carta'), cin = $('#carta-in');
function abrirCarta() {
  const P = D.poema; let paso = -1;
  carta.showModal();
  const mostrar = () => {
    Son.sfx('pagina');
    paso++;
    if (paso === 0) {
      cin.innerHTML = `<p class="etiqueta">Mensaje en una botella</p><h2>${P.titulo}</h2><button class="boton" id="sig">Leer 📜</button>`;
    } else if (paso <= P.estrofas.length) {
      const e = P.estrofas[paso - 1];
      cin.innerHTML = `<p class="num-estrofa">${paso} / ${P.estrofas.length}</p>
        <p class="estrofa">${e.map((v, i) => `<span style="animation-delay:${i*0.45}s">${v}</span>`).join('')}</p>
        <button class="boton" id="sig" style="opacity:0;animation:verso .5s var(--ease-out) ${e.length*0.45+0.3}s forwards">${paso === P.estrofas.length ? 'Terminar 💜' : 'Seguir ›'}</button>`;
    } else {
      if (!hallados.has('poema')) { hallados.add('poema'); guardar(); carta.addEventListener('close', revisarFinal, { once: true }); }
      cin.innerHTML = `${parche('honor', P.honor)}<p class="felicidades">${P.felicidades} 💜</p><p class="firma">— ${P.firma}</p>
        <p id="respuesta" aria-live="polite"></p>
        <div class="acciones"><button class="boton" id="regano">${P.reganos[0][0]}</button><button class="boton sec" id="presumir">Presumir mi campamento ✨</button><button class="boton sec" id="volver">Volver a la playa</button></div>`;
      florecer();
      let r = 0;
      $('#regano').addEventListener('click', ev => {
        $('#respuesta').textContent = P.reganos[r][1];
        r = (r + 1) % P.reganos.length; ev.currentTarget.textContent = P.reganos[r][0];
      });
      $('#volver').addEventListener('click', () => carta.close());
      $('#presumir').addEventListener('click', async () => {
        const url = location.href.split('#')[0], txt = 'Miren lo que me regalaron por mis 20 🥹🏕️';
        try {
          if (navigator.share) await navigator.share({ title: 'Campamento 20', text: txt, url });
          else { await navigator.clipboard.writeText(txt + ' ' + url); $('#respuesta').textContent = '¡Link copiado! Pégalo donde quieras ✨'; }
        } catch (e) {}
      });
      return;
    }
    $('#sig').addEventListener('click', mostrar); $('#sig').focus({ preventScroll: true });
  };
  mostrar();
  lluvia();
}
function florecer() {
  const cont = $('#retamas'); cont.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const x = (i / 25) * 100 + (Math.random() * 3 - 1.5), h = 40 + Math.random() * 70;
    cont.insertAdjacentHTML('beforeend', `<svg class="retama" style="left:${x}%;height:${h}px;animation-delay:${(i%9)*0.12}s" viewBox="0 0 20 60"><path d="M10 60 Q9 30 10 4" stroke="#3f7a4a" stroke-width="1.6" fill="none"/>${[8,16,24,32,40].map((y,k)=>`<ellipse cx="${k%2?13:7}" cy="${y}" rx="3.4" ry="2.4" fill="#f2c14e"/>`).join('')}</svg>`);
  }
}
function lluvia() {
  const l = $('#lluvia'); if (l.childElementCount || quieto) return;
  for (let i = 0; i < 40; i++) l.insertAdjacentHTML('beforeend', `<i style="left:${Math.random()*100}%;--t:${(6+Math.random()*8).toFixed(1)}s;--r:-${(Math.random()*12).toFixed(1)}s;opacity:${(.3+Math.random()*.6).toFixed(2)}"></i>`);
}
carta.addEventListener('close', () => { $('#retamas').innerHTML = ''; });

/* ---------- toques en la escena ---------- */
escena.addEventListener('click', e => {
  const el = e.target.closest('[data-obj]'); if (!el || !D) return;
  const id = el.dataset.obj;
  if (id !== 'sonidera') Son.sfx(id === 'schmubsibu' ? 'cangrejo' : id);
  if (PRINCIPALES.includes(id)) recuerdo(id, el);
  else if (id === 'coco') coco(el);
  else if (id === 'morse') morse();
  else if (id === 'schmubsibu') cangrejo(el);
  else if (id === 'hielo') { copo.classList.remove('cae'); ganarSecreto('hielo'); }
  else if (id === 'sonidera') cumbia(el);
  else if (id === 'tienda') tienda(el);
  else if (id === 'botella') abrirCarta();
});
})();
</script>
